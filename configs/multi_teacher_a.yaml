# Multi-teacher set A: Qwen3-Embedding-8B + BGE-M3 + multilingual-e5-large-instruct.
# Same student, data, loss weights and budget as single_teacher_qwen3_8b.yaml;
# only the teacher list differs, so the comparison isolates the effect of adding teachers.

name: multi_a
output_dir: /content/drive/MyDrive/bitirme/runs
local_tmp_dir: /content/ckpt_staging
tensorboard: true

teachers:
  - name: qwen3_8b
    hf_id: Qwen/Qwen3-Embedding-8B
    revision: 1d8ad4ca9b3dd8059ad90a75d4983776a23d44af
    dim: 4096
    doc_prefix: ""
    max_length: 512
    batch_size: 32
    dtype: bfloat16
    weight: 1.0
  - name: bge_m3
    hf_id: BAAI/bge-m3
    revision: 5617a9f61b028005a4858fdac845db406aefb181
    dim: 1024
    doc_prefix: ""
    max_length: 512
    batch_size: 64
    dtype: float16
    weight: 1.0
  - name: me5_large_instruct
    hf_id: intfloat/multilingual-e5-large-instruct
    revision: 274baa43b0e13e37fafa6428dbc7938e62e5c439
    dim: 1024
    doc_prefix: ""          # documents take no instruction (queries do); see model card
    max_length: 512
    batch_size: 64
    dtype: float16
    weight: 1.0

student:
  hf_id: ytu-ce-cosmos/modernbert-tr-base-1k
  revision: c2e35f553101cce5b03fbb318ef8728473fd34dd
  max_length: 512
  pooling: mean

data:
  corpus_path: /content/drive/MyDrive/bitirme/data/corpus.jsonl
  text_column: text
  cache_dir: /content/drive/MyDrive/bitirme/cache/teachers
  shard_size: 10000          # ~26 min of Qwen3-8B encoding per shard on an L4: the most work lost if a session dies
  max_samples: 1000000
  min_chars: 20
  val_size: 2000

loss:
  cosine_weight: 10.0
  sim_weight: 200.0
  resim_weight: 20.0
  resim_margin: 0.015
  resim_num_samples: 4096
  gor_weight: 0.0

train:
  batch_size: 128
  lr: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_steps: 10000
  grad_clip: 1.0
  bf16: true
  seed: 42
  num_workers: 2
  log_every: 50
  diag_every: 500
  ckpt_every: 1000
  keep_last: 2

eval:
  sts_dataset: null
  sts_split: validation
  sts_columns: null
