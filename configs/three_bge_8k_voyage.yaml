# Voyage pilot: three teachers, BGE-M3 + plain 8K-embed + voyage-4-nano, equal weights, on the 200K mix.
# Why voyage: the student is already at its teachers' level on retrieval (60.5 vs BGE 60.2); the remaining gap to
# Qwen3-8B (~1.2 Mean(task) points) sits in four tasks where BOTH teachers are weak: SciFact (student 78.5, Qwen 87.9),
# ArguAna (48.4 / 59.9), FiQA (45.2 / 52.1), CQADupstack (60.5 / 64.0). voyage-4-nano (346M, Qwen3-based bidirectional,
# 2048-d, mean pooling + Normalize, Apache-2.0) is strong there (plain protocol: SciFact 86.4, retrieval 61.7, total
# 66.27) and adds +0.81 to the BGE + 8K per-task oracle (68.92 -> 69.73), mostly from retrieval. Qwen3-8B added more to
# the oracle (+1.57) and hurt in training, so the oracle does not predict this: a pilot first.
# Encoded plain (the card's default_prompt_name is null, as in our plain eval protocol); no query instruction.
#   teachers.0 = bge_m3     teachers.1 = modernbert_tr_embed     teachers.2 = voyage_4_nano
# Same recipe as the plain-pair reference scale_two_lr1e4_mix200k_s5400 (TR-MTEB 67.16, seed 43 67.25): 200K mix,
# lr 1e-4, 5400 steps. The BGE and 8K caches of the 200K mix exist; only voyage is encoded
# (notebooks/voyage_pilot.ipynb). Voyage alone: configs/single_voyage.yaml (same recipe, one teacher). A lower voyage
# share: --override teachers.2.weight=0.5.

name: three_bge_8k_voyage
output_dir: /content/drive/MyDrive/bitirme/runs
local_tmp_dir: /content/ckpt_staging
tensorboard: true

teachers:
  - name: bge_m3
    hf_id: BAAI/bge-m3
    revision: 5617a9f61b028005a4858fdac845db406aefb181
    dim: 1024
    doc_prefix: ""
    max_length: 512
    batch_size: 64
    dtype: float16
    weight: 1.0
  - name: modernbert_tr_embed
    hf_id: ytu-ce-cosmos/modernbert-tr-embed
    revision: 855820e0079102805908d60d32cd9fd59c970b80
    dim: 768
    doc_prefix: ""
    max_length: 512
    batch_size: 64
    dtype: float32
    weight: 1.0
  - name: voyage_4_nano
    hf_id: voyageai/voyage-4-nano
    revision: 5fb34e870f49f19e79c94d5e118f5ee730133279
    dim: 2048
    doc_prefix: ""
    max_length: 512
    batch_size: 64
    dtype: bfloat16
    trust_remote_code: true
    weight: 1.0

student:
  hf_id: ytu-ce-cosmos/modernbert-tr-base-1k
  revision: c2e35f553101cce5b03fbb318ef8728473fd34dd
  max_length: 512
  pooling: mean

data:
  corpus_path: /content/drive/MyDrive/bitirme/data/mix/mix_v2_200k.jsonl
  text_column: text
  cache_dir: /content/drive/MyDrive/bitirme/cache/teachers
  shard_size: 10000
  max_samples: null
  min_chars: 10
  val_size: 2000

loss:
  cosine_weight: 10.0
  sim_weight: 200.0
  resim_weight: 20.0
  resim_margin: 0.015
  resim_num_samples: 4096
  gor_weight: 0.0

train:
  batch_size: 128
  chunk_size: 32             # gradient caching: same maths, memory of 32 texts (null ran out of memory on an L4)
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_steps: 5400
  grad_clip: 1.0
  bf16: true
  seed: 42
  num_workers: 2
  log_every: 25
  diag_every: 300
  ckpt_every: 300
  keep_last: 2

eval:
  sts_dataset: null
  pairs_val: /content/drive/MyDrive/bitirme/data/stage1/pairs_val.jsonl
  query_max_length: 64
