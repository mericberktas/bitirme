# The student ALSO sees the query instruction: same teachers and caches as stage1_two_bge_m3_modernbert_tr_embed_instr
# (BGE-M3 plain, 8K-embed with its card's query instruction on the mix's 20,000 question texts), but the student input
# of those questions now carries the SAME instruction (`student.query_prefix`), so the 8K head learns "instructed
# question -> instructed teacher vector". Evaluate with the same string as `--query-prompt` (retrieval queries only;
# the 15 non-retrieval tasks are copied from the plain run of the same model). Reference: the same recipe with a plain
# student (`scale_two_instr8k_lr1e4`, 5400 steps, TR-MTEB 67.40 plain). The lab trained modernbert-tr-1k-embed with a
# query instruction and it gained 1.5 points with it (61.41 -> 62.91, retrieval 53.6 -> 57.1).
# No new encoding: the caches of the instructed-teacher runs are reused.
name: instr_student_s5400
output_dir: /content/drive/MyDrive/bitirme/runs
local_tmp_dir: /content/ckpt_staging
tensorboard: true

teachers:
  - name: bge_m3
    hf_id: BAAI/bge-m3
    revision: 5617a9f61b028005a4858fdac845db406aefb181
    dim: 1024
    doc_prefix: ""
    max_length: 512
    batch_size: 64
    dtype: float16
    weight: 1.0
  - name: modernbert_tr_embed_instr
    hf_id: ytu-ce-cosmos/modernbert-tr-embed
    revision: 855820e0079102805908d60d32cd9fd59c970b80
    dim: 768
    doc_prefix: ""
    max_length: 512
    batch_size: 64
    dtype: float32
    weight: 1.0
    # Model card (config_sentence_transformers.json, "query" prompt): a real line break and NO space after "Query:".
    # Only the question buckets of the mix (20.000 of 200.000 texts) get it; everything else is copied from the plain cache.
    query_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
    query_sources:
      - /content/drive/MyDrive/bitirme/data/mix/mix_v2_200k_questions.jsonl
    reuse_plain_from: modernbert_tr_embed

student:
  hf_id: ytu-ce-cosmos/modernbert-tr-base-1k
  revision: c2e35f553101cce5b03fbb318ef8728473fd34dd
  max_length: 512
  pooling: mean
  # exactly the 8K teacher's prompt (a real line break, no space after "Query:")
  query_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
  query_sources:
    - /content/drive/MyDrive/bitirme/data/mix/mix_v2_200k_questions.jsonl

data:
  corpus_path: /content/drive/MyDrive/bitirme/data/mix/mix_v2_200k.jsonl
  text_column: text
  cache_dir: /content/drive/MyDrive/bitirme/cache/teachers
  shard_size: 10000
  max_samples: null
  min_chars: 10
  val_size: 2000

loss:
  cosine_weight: 10.0
  sim_weight: 200.0
  resim_weight: 20.0
  resim_margin: 0.015
  resim_num_samples: 4096
  gor_weight: 0.0

train:
  batch_size: 128
  chunk_size: 32             # gradient caching: same maths, memory of 32 texts (null ran out of memory on an L4)
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_steps: 5400
  grad_clip: 1.0
  bf16: true
  seed: 42
  num_workers: 2
  log_every: 25
  diag_every: 300
  ckpt_every: 300
  keep_last: 2

eval:
  sts_dataset: null
  pairs_val: /content/drive/MyDrive/bitirme/data/stage1/pairs_val.jsonl
  query_max_length: 96   # room for the ~20-token instruction
