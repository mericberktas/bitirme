# Loss ablation, arm "relation only": BGE-M3 single-teacher distillation with ONLY the relation terms
# (in-batch similarity matrix MSE, sim_weight 200, and pair-of-pairs ranking hinge, resim_weight 20) and no vector
# term (cosine_weight 0). The student's embedding is then free to live in its own coordinate system; only the
# pairwise similarities of the teacher are imitated. Everything else is identical to stage1_single_bge_m3.yaml.
# Arms: stage1_single_bge_m3 (mixed), ablloss_bge_vector_only, this one.
#
# Reading the logs of this arm: with cosine_weight 0 the teacher head gets no gradient, so diag/teacher_cosine
# stays near 0 and means nothing; diag/geometry_agreement (Gram correlation) and val/mrr@10 are the meaningful ones.

name: ablloss_bge_relation_only
output_dir: /content/drive/MyDrive/bitirme/runs
local_tmp_dir: /content/ckpt_staging
tensorboard: true

teachers:
  - name: bge_m3
    hf_id: BAAI/bge-m3
    revision: 5617a9f61b028005a4858fdac845db406aefb181
    dim: 1024
    doc_prefix: ""
    max_length: 512
    batch_size: 64
    dtype: float16
    weight: 1.0

student:
  hf_id: ytu-ce-cosmos/modernbert-tr-base-1k
  revision: c2e35f553101cce5b03fbb318ef8728473fd34dd
  max_length: 512
  pooling: mean

data:
  corpus_path: /content/drive/MyDrive/bitirme/data/stage1/corpus_train.jsonl
  text_column: text
  cache_dir: /content/drive/MyDrive/bitirme/cache/teachers
  shard_size: 10000
  max_samples: null
  min_chars: 10
  val_size: 2000

loss:
  cosine_weight: 0.0         # vector term off
  sim_weight: 200.0
  resim_weight: 20.0
  resim_margin: 0.015
  resim_num_samples: 4096
  gor_weight: 0.0

train:
  batch_size: 128
  chunk_size: 32             # gradient caching: same maths, memory of 32 texts (null ran out of memory on an L4)
  lr: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_steps: 1800
  grad_clip: 1.0
  bf16: true
  seed: 42
  num_workers: 2
  log_every: 25
  diag_every: 300
  ckpt_every: 300
  keep_last: 2

eval:
  sts_dataset: null
  pairs_val: /content/drive/MyDrive/bitirme/data/stage1/pairs_val.jsonl
  query_max_length: 64
