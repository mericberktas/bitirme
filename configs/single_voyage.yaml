# Voyage pilot, single teacher: voyage-4-nano alone, same recipe as configs/three_bge_8k_voyage.yaml (200K mix,
# lr 1e-4, 5400 steps). It tells how well the 1k-base student imitates voyage: the comparable single-teacher students
# at lr 1e-4 are BGE-M3 66.07 and 8K-embed 65.67; Qwen3-8B alone (lr 5e-5) gave 63.09 against 65.48 for those two,
# with a student-teacher cosine of 0.79 that never came down. If voyage alone looks like Qwen (weak student, low
# cosine), the three-teacher run is not expected to help either.

name: single_voyage
output_dir: /content/drive/MyDrive/bitirme/runs
local_tmp_dir: /content/ckpt_staging
tensorboard: true

teachers:
  - name: voyage_4_nano
    hf_id: voyageai/voyage-4-nano
    revision: 5fb34e870f49f19e79c94d5e118f5ee730133279
    dim: 2048
    doc_prefix: ""
    max_length: 512
    batch_size: 64
    dtype: bfloat16
    trust_remote_code: true
    weight: 1.0

student:
  hf_id: ytu-ce-cosmos/modernbert-tr-base-1k
  revision: c2e35f553101cce5b03fbb318ef8728473fd34dd
  max_length: 512
  pooling: mean

data:
  corpus_path: /content/drive/MyDrive/bitirme/data/mix/mix_v2_200k.jsonl
  text_column: text
  cache_dir: /content/drive/MyDrive/bitirme/cache/teachers
  shard_size: 10000
  max_samples: null
  min_chars: 10
  val_size: 2000

loss:
  cosine_weight: 10.0
  sim_weight: 200.0
  resim_weight: 20.0
  resim_margin: 0.015
  resim_num_samples: 4096
  gor_weight: 0.0

train:
  batch_size: 128
  chunk_size: 32             # gradient caching: same maths, memory of 32 texts (null ran out of memory on an L4)
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_steps: 5400
  grad_clip: 1.0
  bf16: true
  seed: 42
  num_workers: 2
  log_every: 25
  diag_every: 300
  ckpt_every: 300
  keep_last: 2

eval:
  sts_dataset: null
  pairs_val: /content/drive/MyDrive/bitirme/data/stage1/pairs_val.jsonl
  query_max_length: 64
