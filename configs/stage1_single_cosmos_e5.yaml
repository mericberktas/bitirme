# Stage 1, teacher = Cosmos E5 (ytu-ce-cosmos/turkish-e5-large, ~560M), requested by the advisor. Model card (checked
# 2026-10-22): a fine-tune of intfloat/multilingual-e5-large-instruct with "various Turkish datasets" (multi-positive
# contrastive learning); sentence-transformers pipeline = transformer + pooling + Normalize (modules.json); queries
# take an instruction ("Instruct: {task}\nQuery: {query}"), documents take no prefix. Our own TR-MTEB measurement
# under the plain protocol: 65.92 (mE5-instruct plain: 65.86), so a student like the mE5 one (58.46) is expected.
# Everything but the teacher is identical to stage1_single_bge_m3.yaml (reference: 62.59 +- 0.18 over three seeds).
#
# Plain encoding (doc_prefix ""): the student has no instruction channel and every teacher here is encoded plain.
# About 62% of the stage-1 texts are questions, so the teacher sees them without its query instruction (the same
# situation as the mE5 run). This config therefore cannot separate "compressed geometry" from "missing query
# instruction": both are shared with mE5-instruct.

name: stage1_single_cosmos_e5
output_dir: /content/drive/MyDrive/bitirme/runs
local_tmp_dir: /content/ckpt_staging
tensorboard: true

teachers:
  - name: cosmos_e5
    hf_id: ytu-ce-cosmos/turkish-e5-large
    revision: 02e2362d503bbdeafcb17143b2165c0743f9fdb1
    dim: 1024
    doc_prefix: ""
    max_length: 512
    batch_size: 64
    dtype: float16
    weight: 1.0

student:
  hf_id: ytu-ce-cosmos/modernbert-tr-base-1k
  revision: c2e35f553101cce5b03fbb318ef8728473fd34dd
  max_length: 512
  pooling: mean

data:
  corpus_path: /content/drive/MyDrive/bitirme/data/stage1/corpus_train.jsonl
  text_column: text
  cache_dir: /content/drive/MyDrive/bitirme/cache/teachers
  shard_size: 10000
  max_samples: null
  min_chars: 10
  val_size: 2000

loss:
  cosine_weight: 10.0
  sim_weight: 200.0
  resim_weight: 20.0
  resim_margin: 0.015
  resim_num_samples: 4096
  gor_weight: 0.0

train:
  batch_size: 128
  chunk_size: 32             # gradient caching: same maths, memory of 32 texts (null ran out of memory on an L4)
  lr: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_steps: 1800
  grad_clip: 1.0
  bf16: true
  seed: 42
  num_workers: 2
  log_every: 25
  diag_every: 300
  ckpt_every: 300
  keep_last: 2

eval:
  sts_dataset: null
  pairs_val: /content/drive/MyDrive/bitirme/data/stage1/pairs_val.jsonl
  query_max_length: 64
