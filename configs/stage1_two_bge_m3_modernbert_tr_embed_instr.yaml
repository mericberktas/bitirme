# Same as stage1_two_bge_m3_modernbert_tr_embed, but the 8K teacher sees the lab's query instruction on the mix's question
# texts (the model card recommends it; our plain protocol measured 67.03 while the card reports 68.14). Encode first:
# colab_encode with CONFIG = this file, TEACHERS = ['modernbert_tr_embed_instr'], data.corpus_path = the 200K mix
# (only the 20.000 questions go through the model; the other vectors are copied from the plain modernbert_tr_embed cache).
# Stage 1: two teachers, BGE-M3 and the lab's own 8K embedding model (modernbert-tr-embed), equal weights.
# On the 200K mix (single-teacher runs, same recipe) the two students have different strengths: the 8K-teacher student
# leads on STS (+5.2), SciFact (+8.3), sentiment and offensive-language tasks, the BGE-M3 student on XNLI, TQuAD and
# bitext mining (-5 to -9 for the other). That is the complementary profile earlier pairs (BGE-M3 + Qwen3-8B, BGE-M3 +
# mE5) lacked; whether it carries over to a student trained on both is what this config tests.
#   teachers.0 = bge_m3     teachers.1 = modernbert_tr_embed
# Plain targets (no centring / Gram standardisation): both teachers have similar geometry (mean pairwise cosine 0.294
# and 0.451, std 0.067 / 0.069), unlike mE5. Weights (`--override teachers.0.weight=2`) work as in
# stage1_two_qwen3_8b_bge_m3.yaml. Everything but the teacher list is identical to the other stage-1 configs; the
# vectors are cached per teacher and corpus, so the caches of the single runs are reused. Intended use: the 200K mix,
#   --override data.corpus_path=/content/drive/MyDrive/bitirme/data/mix/mix_v2_200k.jsonl --override name=scale_two_bge_8k_mix200k

name: stage1_two_bge_m3_modernbert_tr_embed_instr
output_dir: /content/drive/MyDrive/bitirme/runs
local_tmp_dir: /content/ckpt_staging
tensorboard: true

teachers:
  - name: bge_m3
    hf_id: BAAI/bge-m3
    revision: 5617a9f61b028005a4858fdac845db406aefb181
    dim: 1024
    doc_prefix: ""
    max_length: 512
    batch_size: 64
    dtype: float16
    weight: 1.0
  - name: modernbert_tr_embed_instr
    hf_id: ytu-ce-cosmos/modernbert-tr-embed
    revision: 855820e0079102805908d60d32cd9fd59c970b80
    dim: 768
    doc_prefix: ""
    max_length: 512
    batch_size: 64
    dtype: float32
    weight: 1.0
    # Model card (config_sentence_transformers.json, "query" prompt): a real line break and NO space after "Query:".
    # Only the question buckets of the mix (20.000 of 200.000 texts) get it; everything else is copied from the plain cache.
    query_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
    query_sources:
      - /content/drive/MyDrive/bitirme/data/mix/mix_v2_200k_questions.jsonl
    reuse_plain_from: modernbert_tr_embed

student:
  hf_id: ytu-ce-cosmos/modernbert-tr-base-1k
  revision: c2e35f553101cce5b03fbb318ef8728473fd34dd
  max_length: 512
  pooling: mean

data:
  corpus_path: /content/drive/MyDrive/bitirme/data/stage1/corpus_train.jsonl
  text_column: text
  cache_dir: /content/drive/MyDrive/bitirme/cache/teachers
  shard_size: 10000
  max_samples: null
  min_chars: 10
  val_size: 2000

loss:
  cosine_weight: 10.0
  sim_weight: 200.0
  resim_weight: 20.0
  resim_margin: 0.015
  resim_num_samples: 4096
  gor_weight: 0.0

train:
  batch_size: 128
  chunk_size: 32             # gradient caching: same maths, memory of 32 texts (null ran out of memory on an L4)
  lr: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_steps: 1800
  grad_clip: 1.0
  bf16: true
  seed: 42
  num_workers: 2
  log_every: 25
  diag_every: 300
  ckpt_every: 300
  keep_last: 2

eval:
  sts_dataset: null
  pairs_val: /content/drive/MyDrive/bitirme/data/stage1/pairs_val.jsonl
  query_max_length: 64
