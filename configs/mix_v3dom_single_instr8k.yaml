# Single-teacher control of the main line: identical to mix_v3dom_two_instr8k.yaml (1k-base student, mix v3 + domain
# texts, 450K, lr 1e-4, 21,600 steps, seed 42) except that only the instructed 8K-embed teacher is kept (questions with
# the card's query instruction, the other texts from the plain cache). Both caches already exist (the main-line run
# used them), so nothing is encoded.
# Why: 'two teachers beat the best single teacher' was shown at 5400 steps on the 200K mix (+1.09 at lr 1e-4: 67.16 vs
# BGE 66.07, 8K 65.67); single students gained more from budget than the pair did earlier (+1.8 from 1800 to 5400
# steps), so the gap must be measured at the main-line budget. Reference: main_v3dom_s21600, 68.27 (seed 43: 68.30).

name: mix_v3dom_single_instr8k
output_dir: /content/drive/MyDrive/bitirme/runs
local_tmp_dir: /content/ckpt_staging
tensorboard: true

teachers:
  - name: modernbert_tr_embed_instr
    hf_id: ytu-ce-cosmos/modernbert-tr-embed
    revision: 855820e0079102805908d60d32cd9fd59c970b80
    dim: 768
    doc_prefix: ""
    max_length: 512
    batch_size: 64
    dtype: float32
    weight: 1.0
    # Model card (config_sentence_transformers.json, "query" prompt): a real line break and NO space after "Query:".
    # Only the questions of the mix (90,000 of 450,000 texts) get it; everything else is copied from the plain cache.
    query_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
    query_sources:
      - /content/drive/MyDrive/bitirme/data/mix/mix_v3dom_450k_questions.jsonl
    reuse_plain_from: modernbert_tr_embed

student:
  hf_id: ytu-ce-cosmos/modernbert-tr-base-1k
  revision: c2e35f553101cce5b03fbb318ef8728473fd34dd
  max_length: 512
  pooling: mean

data:
  corpus_path: /content/drive/MyDrive/bitirme/data/mix/mix_v3dom_450k.jsonl
  text_column: text
  cache_dir: /content/drive/MyDrive/bitirme/cache/teachers
  shard_size: 10000
  max_samples: null
  min_chars: 10
  val_size: 2000

loss:
  cosine_weight: 10.0
  sim_weight: 200.0
  resim_weight: 20.0
  resim_margin: 0.015
  resim_num_samples: 4096
  gor_weight: 0.0

train:
  batch_size: 128
  chunk_size: 32             # gradient caching: same maths, memory of 32 texts (null ran out of memory on an L4)
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_steps: 21600
  grad_clip: 1.0
  bf16: true
  seed: 42
  num_workers: 2
  log_every: 25
  diag_every: 300
  ckpt_every: 300
  keep_last: 2

eval:
  sts_dataset: null
  pairs_val: /content/drive/MyDrive/bitirme/data/stage1/pairs_val.jsonl
  query_max_length: 64
