# Stage 1, Cosmos E5 as a single teacher with its query instruction on the QUESTION texts (55% of the stage-1 texts:
# those in pairs_train/pairs_val); passages stay plain (model card: documents take no instruction). The student still
# sees the raw text. The plain run (stage1_single_cosmos_e5, 59.94) encoded everything without the instruction. Only the
# questions go through the model: the passage vectors are copied from the existing cosmos_e5 cache.
#
# Instruction format (model card): "Instruct: {task_description}", a line break, then "Query: {query}"; recommended
# task "Given a Turkish
# search query, retrieve relevant passages written in Turkish that best answer the query". Cosmos E5's geometry is
# spread out (mean pairwise cosine 0.33), so this run isolates the instruction effect from the geometry effect
# (mE5-instruct, in a narrow cone, mixes the two). Everything but the teacher entry is identical to
# stage1_single_cosmos_e5.yaml.

name: stage1_single_cosmos_e5_instr
output_dir: /content/drive/MyDrive/bitirme/runs
local_tmp_dir: /content/ckpt_staging
tensorboard: true

teachers:
  - name: cosmos_e5_instr
    hf_id: ytu-ce-cosmos/turkish-e5-large
    revision: 02e2362d503bbdeafcb17143b2165c0743f9fdb1
    dim: 1024
    doc_prefix: ""
    max_length: 512
    batch_size: 64
    dtype: float16
    weight: 1.0
    query_prefix: "Instruct: Given a Turkish search query, retrieve relevant passages written in Turkish that best answer the query\nQuery: "
    query_sources:
      - /content/drive/MyDrive/bitirme/data/stage1/pairs_train.jsonl
      - /content/drive/MyDrive/bitirme/data/stage1/pairs_val.jsonl
    reuse_plain_from: cosmos_e5

student:
  hf_id: ytu-ce-cosmos/modernbert-tr-base-1k
  revision: c2e35f553101cce5b03fbb318ef8728473fd34dd
  max_length: 512
  pooling: mean

data:
  corpus_path: /content/drive/MyDrive/bitirme/data/stage1/corpus_train.jsonl
  text_column: text
  cache_dir: /content/drive/MyDrive/bitirme/cache/teachers
  shard_size: 10000
  max_samples: null
  min_chars: 10
  val_size: 2000

loss:
  cosine_weight: 10.0
  sim_weight: 200.0
  resim_weight: 20.0
  resim_margin: 0.015
  resim_num_samples: 4096
  gor_weight: 0.0

train:
  batch_size: 128
  chunk_size: 32             # gradient caching: same maths, memory of 32 texts (null ran out of memory on an L4)
  lr: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_steps: 1800
  grad_clip: 1.0
  bf16: true
  seed: 42
  num_workers: 2
  log_every: 25
  diag_every: 300
  ckpt_every: 300
  keep_last: 2

eval:
  sts_dataset: null
  pairs_val: /content/drive/MyDrive/bitirme/data/stage1/pairs_val.jsonl
  query_max_length: 64
